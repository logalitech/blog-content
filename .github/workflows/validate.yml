name: Validate content

# Puerta de calidad de cada PR: aplica al contenido las mismas reglas que la
# compilación de la web (cabecera YAML, esquema de campos, compilación MDX y
# diagramas Mermaid). Si pasa, el contenido no puede romper la publicación.
# Los errores bloquean la fusión; el detalle aparece en el resumen del job.
# Autónomo: sin secretos ni acceso a otros repositorios (repo público).
#
# Se repite también cuando una PR sale del estado borrador o cambia de
# etiqueta (el editor visual marca con decap-cms/pending_publish las PR en
# estado Ready): el resultado correcto dispara la fusión automática
# (auto-merge.yml).
#
# El nombre del job (validate) es el check obligatorio de la protección de
# la rama main, y el nombre del flujo (Validate content) lo usa
# auto-merge.yml: no se deben cambiar sin actualizar ambos.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Instalar el validador
        run: npm ci --prefix scripts --no-audit --no-fund

      - name: Validar contenido
        run: node scripts/validate.mjs
